<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>TECH SOCIETY · Tenant Details</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== GLOBAL RESET ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { height:100%; }

        /* ===== BODY – full-screen centre with animated blue background ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: 
                radial-gradient(circle at 25% 25%, rgba(59,130,246,0.25) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(37,99,235,0.25) 0%, transparent 55%),
                linear-gradient(145deg, #0a0f1a 0%, #112244 40%, #0d1b3e 100%);
            min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
            color:#e2e8f0; padding:1rem; line-height:1.5; position:relative; overflow-x:hidden;
        }

        /* ===== FLOATING BACKGROUND BLOBS ===== */
        body::before, body::after {
            content:''; position:fixed; border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none;
            animation:floatBlob 20s infinite alternate ease-in-out;
        }
        body::before { width:320px; height:320px; background:radial-gradient(circle, rgba(59,130,246,0.45) 0%, transparent 70%); top:-120px; left:-120px; }
        body::after { width:300px; height:300px; background:radial-gradient(circle, rgba(37,99,235,0.45) 0%, transparent 70%); bottom:-100px; right:-100px; animation-duration:25s; animation-delay:-5s; }
        @keyframes floatBlob {
            0% { transform:translate(0,0) scale(1); }
            33% { transform:translate(30px,-40px) scale(1.15); }
            66% { transform:translate(-20px,20px) scale(0.9); }
            100% { transform:translate(10px,-10px) scale(1.05); }
        }

        /* ===== FORM CARD (glass‑morphism) ===== */
        .form-card {
            width:100%; max-width:520px; background:rgba(15,23,42,0.85);
            backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            border-radius:1.5rem; padding:2.5rem 2rem; margin:auto; position:relative; z-index:1;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
            animation:cardEntry 0.6s cubic-bezier(0.22,1,0.36,1) both;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7), 0 0 30px rgba(59,130,246,0.15); overflow:hidden;
        }
        /* gradient border */
        .form-card::before {
            content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
            background:linear-gradient(135deg, #3b82f6, #60a5fa, #1d4ed8);
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; transition:opacity 0.3s;
        }
        /* inner glow */
        .form-card::after {
            content:''; position:absolute; top:-40%; left:-40%; width:180%; height:180%;
            background:radial-gradient(circle at 30% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
                       radial-gradient(circle at 70% 70%, rgba(37,99,235,0.06) 0%, transparent 50%);
            pointer-events:none;
        }
        @keyframes cardEntry {
            0% { opacity:0; transform:translateY(30px) scale(0.97); }
            100% { opacity:1; transform:translateY(0) scale(1); }
        }
        @media (hover:hover) {
            .form-card:hover { transform:translateY(-5px); box-shadow: 0 35px 70px -15px rgba(0,0,0,0.8), 0 0 40px rgba(59,130,246,0.25); }
            .form-card:hover::before { opacity:0.9; }
        }

        /* ===== BACK BUTTON (top‑left circle) ===== */
        .back-top {
            position: absolute; top: 0.75rem; left: 0.75rem; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8; text-decoration: none;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        .back-top:hover { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; transform: translateX(-2px); }
        .back-top svg { width:16px; height:16px; }

        /* ===== BRAND LOGO ===== */
        .logo {
            font-size:1.5rem; font-weight:700; margin-top:0.5rem; margin-bottom:0.5rem;
            letter-spacing:-0.3px; white-space:nowrap;
            display:inline-block; transition:transform 0.3s ease; z-index:1; position:relative;
        }
        .logo:hover { transform:scale(1.03); }
        .logo span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa, #2563eb);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; animation:gradientShift 3s ease infinite; background-size:200% 200%;
        }
        @keyframes gradientShift {
            0%,100% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
        }

        /* ===== HEADING & SUBTITLE ===== */
        h1 {
            font-size:1.6rem; font-weight:700; margin-bottom:0.25rem; letter-spacing:-0.4px;
            background:linear-gradient(to right, #e0e7ff, #93c5fd);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; text-align:center; position:relative; z-index:1;
        }
        .subhead { font-size:0.9rem; color:#94a3b8; margin-bottom:2rem; text-align:center; position:relative; z-index:1; }

        /* ===== FORM ===== */
        form { display:flex; flex-direction:column; gap:1rem; position:relative; z-index:1; }
        .input-group { display:flex; flex-direction:column; gap:4px; }
        label {
            font-size:0.85rem; font-weight:500; color:#94a3b8;
            display:flex; align-items:center; gap:0.35rem; line-height:1.3;
        }
        .label-icon { display:inline-flex; align-items:center; opacity:0.7; }

        /* ===== INPUT FIELDS ===== */
        input[type="text"], input[type="password"], input[type="tel"], input[type="number"] {
            padding:0.75rem 0.9rem; border-radius:0.6rem; border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.04); color:#e2e8f0; outline:none; font-size:0.95rem;
            font-family:'Inter',sans-serif; transition:transform 0.2s ease, box-shadow 0.25s ease, border-color 0.2s;
            width:100%; position:relative; z-index:1;
        }
        input::placeholder { color:#64748b; }
        input:focus {
            border-color:#60a5fa; box-shadow:0 0 0 3px rgba(96,165,250,0.18), 0 0 20px rgba(59,130,246,0.2);
            transform:scale(1.02); background:rgba(255,255,255,0.04); outline:none;
        }

        /* ===== PASSWORD TOGGLE ===== */
        .password-wrapper { position:relative; display:flex; align-items:center; }
        .password-wrapper input { padding-right:2.8rem; }
        .toggle-password {
            position:absolute; right:0.6rem; background:none; border:none; color:#94a3b8; cursor:pointer;
            display:flex; align-items:center; justify-content:center; padding:0.4rem; border-radius:0.4rem;
            transition:background 0.2s, color 0.2s, transform 0.15s; z-index:2; outline:none; opacity:0.7;
        }
        .toggle-password:hover { background:rgba(255,255,255,0.08); color:#60a5fa; opacity:1; }
        .toggle-password:active { transform:scale(0.92); }
        .toggle-password svg { width:18px; height:18px; }

        /* ===== VEHICLE SECTION (checkboxes + dynamic plates) ===== */
        .vehicle-section { display:flex; flex-direction:column; gap:0.6rem; }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .checkbox-item {
            display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;
            color: #cbd5e1; cursor: pointer; user-select: none;
        }
        .checkbox-item input[type="checkbox"] { display: none; }
        .custom-check {
            width: 20px; height: 20px; border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.04);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
            flex-shrink: 0;
        }
        .checkbox-item input:checked + .custom-check {
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            border-color: transparent; box-shadow: 0 0 10px rgba(59,130,246,0.5);
        }
        .custom-check svg { width:12px; height:12px; stroke:white; stroke-width:2; opacity:0; transition:opacity 0.2s; }
        .checkbox-item input:checked + .custom-check svg { opacity:1; }

        .vehicle-count {
            font-size: 0.8rem; color: #60a5fa; font-weight: 500;
            margin-bottom: 0.3rem;
        }
        /* hidden vehicle detail (shown when checkbox checked) */
        .vehicle-detail {
            display: none; flex-direction: column; gap: 0.5rem;
            padding-left: 0.5rem; border-left: 2px solid rgba(96,165,250,0.3);
        }
        .vehicle-detail.active { display: flex; }
        .plate-list { display: flex; flex-direction: column; gap: 0.5rem; }

        /* ===== SUBMIT BUTTON ===== */
        .btn {
            margin-top:4px; padding:0.85rem; border-radius:0.6rem; border:none;
            background:linear-gradient(135deg, #2563eb, #1d4ed8, #3b82f6); background-size:200% 200%;
            color:white; font-weight:600; font-size:1rem; cursor:pointer; font-family:'Inter',sans-serif;
            letter-spacing:0.15px; transition:transform 0.2s, box-shadow 0.3s, opacity 0.25s, background-position 0.4s;
            position:relative; overflow:hidden; box-shadow:0 4px 15px rgba(59,130,246,0.4);
            animation:btnGlow 2.5s infinite alternate; z-index:1;
            display:flex; align-items:center; justify-content:center; gap:0.5rem;
        }
        @keyframes btnGlow {
            0% { box-shadow:0 0 8px rgba(59,130,246,0.7); }
            100% { box-shadow:0 0 25px rgba(37,99,235,0.9), 0 0 10px rgba(96,165,250,0.8); }
        }
        .btn:hover { transform:translateY(-2px); background-position:100% 0%; box-shadow:0 10px 30px rgba(37,99,235,0.65), 0 0 20px rgba(59,130,246,0.6); animation:none; }
        .btn:active { transform:translateY(0); opacity:0.9; }

        /* ===== RESPONSIVE ===== */
        @media (max-width:480px) {
            .form-card { padding:1.8rem 1.5rem; border-radius:1.25rem; }
            .logo { font-size:1.3rem; margin-top:0.4rem; margin-bottom:0.4rem; }
            h1 { font-size:1.4rem; }
            .subhead { font-size:0.85rem; margin-bottom:1.5rem; }
            label { font-size:0.8rem; }
            input { padding:0.7rem 0.8rem; font-size:0.9rem; border-radius:0.5rem; }
            .btn { padding:0.8rem; font-size:0.95rem; }
            .back-top { top:0.6rem; left:0.6rem; width:28px; height:28px; }
            .back-top svg { width:15px; height:15px; }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="form-card">
    <!-- ===== BACK BUTTON ===== -->
    <a href="javascript:history.back()" class="back-top" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
    </a>

    <!-- ===== BRAND LOGO ===== -->
    <div class="logo">🏡 TECH <span>SOCIETY</span></div>

    <!-- ===== PAGE HEADING ===== -->
    <h1>Tenant details</h1>
    <p class="subhead">Enter flat owner credentials and tenant details</p>

    <form id="tenantForm" autocomplete="off" novalidate>

        <!-- ===== FLAT OWNER USER ID ===== -->
        <div class="input-group">
            <label for="ownerUid">
                <span class="label-icon"><!-- Person icon --></span>
                Flat Owner User ID
            </label>
            <input type="text" id="ownerUid" name="ownerUid" placeholder="e.g., OWNER-001" required autofocus />
        </div>

        <!-- ===== PASSWORD (for owner verification) ===== -->
        <div class="input-group">
            <label for="password">
                <span class="label-icon"><!-- Lock icon --></span>
                Password
            </label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="••••••••" required />
                <button type="button" class="toggle-password" aria-label="Toggle password visibility" tabindex="-1">
                    <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- ===== TENANT NAME ===== -->
        <div class="input-group">
            <label for="tenantName">
                <span class="label-icon"><!-- Person icon --></span>
                Tenant Name
            </label>
            <input type="text" id="tenantName" name="tenantName" placeholder="e.g., Rahul Sharma" required />
        </div>

        <!-- ===== CONTACT NUMBER ===== -->
        <div class="input-group">
            <label for="contact">
                <span class="label-icon"><!-- Phone icon --></span>
                Contact Number
            </label>
            <input type="tel" id="contact" name="contact" placeholder="e.g., +91 98765 43210" required inputmode="numeric" />
        </div>

        <!-- ===== VEHICLE SECTION ===== -->
        <div class="input-group">
            <label>Do you have any vehicles?</label>
            <div class="vehicle-section">
                <div class="vehicle-count" id="vehicleCount">Total vehicles: 0</div>
                <div class="checkbox-grid">
                    <label class="checkbox-item">
                        <input type="checkbox" id="carCheck" name="vehicle" value="Car" onchange="handleVehicleToggle('car')" />
                        <span class="custom-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span> Car
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="scootyCheck" name="vehicle" value="Scooty" onchange="handleVehicleToggle('scooty')" />
                        <span class="custom-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span> Scooty
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="bikeCheck" name="vehicle" value="Bike" onchange="handleVehicleToggle('bike')" />
                        <span class="custom-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span> Bike
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="otherCheck" name="vehicle" value="Other" onchange="handleVehicleToggle('other')" />
                        <span class="custom-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span> Other
                    </label>
                </div>

                <!-- Dynamic number‑plate fields (shown/hidden by JS) -->
                <div id="carSection" class="vehicle-detail">
                    <label>How many Cars?</label>
                    <input type="number" id="carCount" min="1" value="1" onchange="generatePlates('car')" />
                    <div id="carPlates" class="plate-list"></div>
                </div>
                <div id="scootySection" class="vehicle-detail">
                    <label>How many Scooties?</label>
                    <input type="number" id="scootyCount" min="1" value="1" onchange="generatePlates('scooty')" />
                    <div id="scootyPlates" class="plate-list"></div>
                </div>
                <div id="bikeSection" class="vehicle-detail">
                    <label>How many Bikes?</label>
                    <input type="number" id="bikeCount" min="1" value="1" onchange="generatePlates('bike')" />
                    <div id="bikePlates" class="plate-list"></div>
                </div>
                <div id="otherSection" class="vehicle-detail">
                    <label>How many other vehicles?</label>
                    <input type="number" id="otherCount" min="1" value="1" onchange="generatePlates('other')" />
                    <div style="margin-top:0.5rem;">
                        <label for="otherVehicleDesc">Please specify the vehicle</label>
                        <input type="text" id="otherVehicleDesc" placeholder="e.g., Truck, Van" />
                    </div>
                    <div id="otherPlates" class="plate-list" style="margin-top:0.5rem;"></div>
                </div>
            </div>
        </div>

        <!-- ===== REGISTER BUTTON ===== -->
        <button type="submit" class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14" /><polyline points="12 5 19 12 12 19" />
            </svg>
            Register Tenant
        </button>
    </form>
</div>

<script>
    // ===== PASSWORD TOGGLE (eye icon) =====
    (function() {
        const toggleBtn = document.querySelector('.toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');
        if (toggleBtn && passwordInput && eyeOpen && eyeClosed) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                eyeOpen.style.display = isPassword ? 'none' : 'block';
                eyeClosed.style.display = isPassword ? 'block' : 'none';
            });
            toggleBtn.addEventListener('mousedown', function(e) { e.preventDefault(); });
        }
    })();

    // ===== VEHICLE DYNAMIC LOGIC =====
    const vehicleTypes = ['car', 'scooty', 'bike', 'other'];

    // Show/hide vehicle detail sections
    function handleVehicleToggle(type) {
        const check = document.getElementById(`${type}Check`);
        const section = document.getElementById(`${type}Section`);
        if (check.checked) {
            section.classList.add('active');
            generatePlates(type);
        } else {
            section.classList.remove('active');
        }
        updateTotalCount();
    }

    // Generate number‑plate inputs based on count
    function generatePlates(type) {
        const countInput = document.getElementById(`${type}Count`);
        const platesContainer = document.getElementById(`${type}Plates`);
        if (!countInput || !platesContainer) return;
        let count = parseInt(countInput.value, 10);
        if (isNaN(count) || count < 1) { count = 1; countInput.value = 1; }
        platesContainer.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `<label for="${type}Plate${i}">Number plate ${i}</label>
                             <input type="text" id="${type}Plate${i}" name="${type}Plate${i}" placeholder="e.g., HR 26 XX 1234" />`;
            platesContainer.appendChild(div);
        }
        updateTotalCount();
    }

    // Update total vehicle count
    function updateTotalCount() {
        let total = 0;
        vehicleTypes.forEach(type => {
            const check = document.getElementById(`${type}Check`);
            const countInput = document.getElementById(`${type}Count`);
            if (check && check.checked && countInput) {
                const cnt = parseInt(countInput.value, 10);
                if (!isNaN(cnt) && cnt > 0) total += cnt;
            }
        });
        document.getElementById('vehicleCount').textContent = `Total vehicles: ${total}`;
    }

    // Initialise state
    document.addEventListener('DOMContentLoaded', () => {
        vehicleTypes.forEach(type => {
            const check = document.getElementById(`${type}Check`);
            if (check) check.checked = false;
            const section = document.getElementById(`${type}Section`);
            if (section) section.classList.remove('active');
        });
        updateTotalCount();
    });

    // ===== FORM SUBMISSION – validates fields and redirects to USID =====
    document.getElementById('tenantForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const ownerUid = document.getElementById('ownerUid').value.trim();
        const password = document.getElementById('password').value;
        const tenantName = document.getElementById('tenantName').value.trim();
        const contact = document.getElementById('contact').value.trim();

        if (!ownerUid) { alert('Please enter the flat owner user ID.'); return; }
        if (!password) { alert('Please enter the password.'); return; }
        if (!tenantName) { alert('Please enter the tenant name.'); return; }
        if (!contact) { alert('Please enter the contact number.'); return; }

        // Redirect to USID page with tenant role
        window.location.href = 'USID.html?role=tenant';
    });
</script>

</body>
</html>
