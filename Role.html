<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="description" content="TECH SOCIETY - Select your role" />
    <title>TECH SOCIETY · Who are you?</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html { height:100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: 
                radial-gradient(circle at 25% 25%, rgba(59,130,246,0.25) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(37,99,235,0.25) 0%, transparent 55%),
                linear-gradient(145deg, #0a0f1a 0%, #112244 40%, #0d1b3e 100%);
            min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
            color:#e2e8f0; padding:1rem; line-height:1.5; position:relative; overflow-x:hidden;
        }
        body::before, body::after {
            content:''; position:fixed; border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none;
            animation:floatBlob 20s infinite alternate ease-in-out;
        }
        body::before { width:320px; height:320px; background:radial-gradient(circle, rgba(59,130,246,0.45) 0%, transparent 70%); top:-120px; left:-120px; }
        body::after { width:300px; height:300px; background:radial-gradient(circle, rgba(37,99,235,0.45) 0%, transparent 70%); bottom:-100px; right:-100px; animation-duration:25s; animation-delay:-5s; }
        @keyframes floatBlob {
            0% { transform:translate(0,0) scale(1); }
            33% { transform:translate(30px,-40px) scale(1.15); }
            66% { transform:translate(-20px,20px) scale(0.9); }
            100% { transform:translate(10px,-10px) scale(1.05); }
        }
        .role-card {
            width:100%; max-width:500px; background:rgba(15,23,42,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            border-radius:1.5rem; padding:2.5rem 2rem; margin:auto; position:relative; z-index:1;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
            animation:cardEntry 0.6s cubic-bezier(0.22,1,0.36,1) both;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7), 0 0 30px rgba(59,130,246,0.15); overflow:hidden;
        }
        .role-card::before {
            content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
            background:linear-gradient(135deg, #3b82f6, #60a5fa, #1d4ed8);
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; transition:opacity 0.3s;
        }
        .role-card::after {
            content:''; position:absolute; top:-40%; left:-40%; width:180%; height:180%;
            background:radial-gradient(circle at 30% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
                       radial-gradient(circle at 70% 70%, rgba(37,99,235,0.06) 0%, transparent 50%);
            pointer-events:none;
        }
        @keyframes cardEntry {
            0% { opacity:0; transform:translateY(30px) scale(0.97); }
            100% { opacity:1; transform:translateY(0) scale(1); }
        }
        @media (hover:hover) {
            .role-card:hover { transform:translateY(-5px); box-shadow: 0 35px 70px -15px rgba(0,0,0,0.8), 0 0 40px rgba(59,130,246,0.25); }
            .role-card:hover::before { opacity:0.9; }
        }
        .logo {
            font-size:1.5rem; font-weight:700; margin-bottom:0.5rem; letter-spacing:-0.3px; white-space:nowrap;
            display:inline-block; transition:transform 0.3s ease; z-index:1; position:relative;
        }
        .logo:hover { transform:scale(1.03); }
        .logo span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa, #2563eb);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            animation:gradientShift 3s ease infinite; background-size:200% 200%;
        }
        @keyframes gradientShift {
            0%,100% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
        }
        h1 {
            font-size:1.8rem; font-weight:700; margin-bottom:0.4rem; letter-spacing:-0.4px;
            background:linear-gradient(to right, #e0e7ff, #93c5fd);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            text-align:center; position:relative; z-index:1;
        }
        .subhead { font-size:0.9rem; color:#94a3b8; margin-bottom:1.8rem; text-align:center; position:relative; z-index:1; }
        .roles-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; position:relative; z-index:1; }
        .role-btn {
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem;
            padding:1.5rem 1rem; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
            border-radius:1rem; color:#e2e8f0; cursor:pointer; transition:all 0.25s ease; outline:none;
            text-decoration:none; position:relative; overflow:hidden;
        }
        .role-btn::before {
            content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(59,130,246,0.15), rgba(37,99,235,0.1));
            opacity:0; transition:opacity 0.25s; border-radius:inherit;
        }
        .role-btn:hover {
            background:rgba(59,130,246,0.1); border-color:rgba(96,165,250,0.5); transform:translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(59,130,246,0.25);
        }
        .role-btn:hover::before { opacity:1; }
        .role-btn:active { transform:translateY(0); }
        .role-icon {
            font-size:2.2rem; display:flex; align-items:center; justify-content:center; width:60px; height:60px;
            border-radius:50%; background:rgba(59,130,246,0.15); transition:background 0.25s; z-index:2;
        }
        .role-btn:hover .role-icon { background:rgba(59,130,246,0.3); }
        .role-label { font-weight:600; font-size:0.95rem; z-index:2; }
        .role-desc {
            font-size:0.7rem; color:#94a3b8; text-align:center; z-index:2; opacity:0; transition:opacity 0.25s;
        }
        .role-btn:hover .role-desc { opacity:1; }
        @media (max-width:480px) {
            .role-card { padding:1.8rem 1.5rem; border-radius:1.25rem; }
            .logo { font-size:1.3rem; margin-bottom:0.3rem; }
            h1 { font-size:1.5rem; }
            .subhead { font-size:0.82rem; margin-bottom:1.3rem; }
            .roles-grid { gap:0.7rem; }
            .role-btn { padding:1.2rem 0.8rem; }
            .role-icon { font-size:1.8rem; width:50px; height:50px; }
            .role-label { font-size:0.85rem; }
        }
        @media (max-width:380px) {
            .role-card { padding:1.5rem 1.2rem; border-radius:1rem; }
            .roles-grid { grid-template-columns:1fr; }
            .role-btn { flex-direction:row; gap:1rem; padding:1rem; }
            .role-icon { width:45px; height:45px; font-size:1.5rem; }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="role-card">
    <div class="logo">🏡 TECH <span>SOCIETY</span></div>

    <h1>Who are you?</h1>
    <p class="subhead">Select your role to continue</p>

    <div class="roles-grid">
        <!-- Secretary (direct to login) -->
        <button class="role-btn" onclick="selectRole('Secretary')">
            <div class="role-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                    <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
                    <circle cx="12" cy="14" r="1" />
                    <path d="M8 14h8" />
                </svg>
            </div>
            <span class="role-label">Secretary</span>
            <span class="role-desc">Manage society affairs</span>
        </button>

        <!-- Flat Owner (goes to USID page) -->
        <button class="role-btn" onclick="selectRole('Flat Owner')">
            <div class="role-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </div>
            <span class="role-label">Flat Owner</span>
            <span class="role-desc">Own a flat in society</span>
        </button>

        <!-- Tenant (goes to USID page) -->
        <button class="role-btn" onclick="selectRole('Tenant')">
            <div class="role-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="8.5" cy="7" r="4" />
                    <path d="M16 11l2 2 4-4" />
                </svg>
            </div>
            <span class="role-label">Tenant</span>
            <span class="role-desc">Renting a flat</span>
        </button>

        <!-- Staff (goes to USID page) -->
        <button class="role-btn" onclick="selectRole('Staff')">
            <div class="role-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="10" r="3" />
                    <path d="M12 2v2" />
                    <path d="M12 18v2" />
                    <path d="M4.93 4.93l1.41 1.41" />
                    <path d="M17.66 17.66l1.41 1.41" />
                    <path d="M2 10h2" />
                    <path d="M20 10h2" />
                    <path d="M4.93 15.07l1.41-1.41" />
                    <path d="M17.66 6.34l1.41-1.41" />
                </svg>
            </div>
            <span class="role-label">Staff</span>
            <span class="role-desc">Security, maintenance, etc.</span>
        </button>
    </div>
</div>

<script>
    function selectRole(role) {
        // Secretary goes directly to its login page,
        // others go to USID.html with role query param
        const pages = {
            'Secretary': 'Secratary login page.html',
            'Flat Owner': 'USID.html?role=flatowner',
            'Tenant': 'USID.html?role=tenant',
            'Staff': 'USID.html?role=staff'
        };
        window.location.href = pages[role];
    }
</script>

</body>
</html>
