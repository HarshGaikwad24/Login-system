<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>TECH SOCIETY · Society Details</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== GLOBAL RESET ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { height:100%; }

        /* ===== BODY – same floating background ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: 
                radial-gradient(circle at 25% 25%, rgba(59,130,246,0.25) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(37,99,235,0.25) 0%, transparent 55%),
                linear-gradient(145deg, #0a0f1a 0%, #112244 40%, #0d1b3e 100%);
            min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
            color:#e2e8f0; padding:1rem; line-height:1.5; position:relative; overflow-x:hidden;
        }
        body::before, body::after {
            content:''; position:fixed; border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none;
            animation:floatBlob 20s infinite alternate ease-in-out;
        }
        body::before { width:320px; height:320px; background:radial-gradient(circle, rgba(59,130,246,0.45) 0%, transparent 70%); top:-120px; left:-120px; }
        body::after { width:300px; height:300px; background:radial-gradient(circle, rgba(37,99,235,0.45) 0%, transparent 70%); bottom:-100px; right:-100px; animation-duration:25s; animation-delay:-5s; }
        @keyframes floatBlob {
            0% { transform:translate(0,0) scale(1); }
            33% { transform:translate(30px,-40px) scale(1.15); }
            66% { transform:translate(-20px,20px) scale(0.9); }
            100% { transform:translate(10px,-10px) scale(1.05); }
        }

        /* ===== DATA CARD ===== */
        .details-card {
            width:100%; max-width:460px; background:rgba(15,23,42,0.85);
            backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            border-radius:1.5rem; padding:2.5rem 2rem; margin:auto;
            position:relative; z-index:1;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
            animation:cardEntry 0.6s cubic-bezier(0.22,1,0.36,1) both;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7), 0 0 30px rgba(59,130,246,0.15);
            overflow:hidden;
        }
        .details-card::before {
            content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
            background:linear-gradient(135deg, #3b82f6, #60a5fa, #1d4ed8);
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; transition:opacity 0.3s;
        }
        .details-card::after {
            content:''; position:absolute; top:-40%; left:-40%; width:180%; height:180%;
            background:radial-gradient(circle at 30% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
                       radial-gradient(circle at 70% 70%, rgba(37,99,235,0.06) 0%, transparent 50%);
            pointer-events:none;
        }
        @keyframes cardEntry {
            0% { opacity:0; transform:translateY(30px) scale(0.97); }
            100% { opacity:1; transform:translateY(0) scale(1); }
        }
        @media (hover:hover) {
            .details-card:hover { transform:translateY(-5px); box-shadow: 0 35px 70px -15px rgba(0,0,0,0.8), 0 0 40px rgba(59,130,246,0.25); }
            .details-card:hover::before { opacity:0.9; }
        }

        /* ===== BACK BUTTON ===== */
        .back-top {
            position: absolute; top: 0.75rem; left: 0.75rem; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8; text-decoration: none;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        .back-top:hover { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; transform: translateX(-2px); }
        .back-top svg { width: 16px; height: 16px; }

        /* ===== BRAND LOGO ===== */
        .logo {
            font-size:1.5rem; font-weight:700; margin-top: 0.5rem; margin-bottom:0.5rem;
            letter-spacing:-0.3px; white-space:nowrap;
            display:inline-block; transition:transform 0.3s ease; z-index:1; position:relative;
        }
        .logo:hover { transform:scale(1.03); }
        .logo span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa, #2563eb);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; animation:gradientShift 3s ease infinite; background-size:200% 200%;
        }
        @keyframes gradientShift {
            0%,100% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
        }

        /* ===== HEADING ===== */
        h1 {
            font-size:1.6rem; font-weight:700; margin-bottom:0.25rem; letter-spacing:-0.4px;
            background:linear-gradient(to right, #e0e7ff, #93c5fd);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; text-align:center; position:relative; z-index:1;
        }
        .subhead { font-size:0.9rem; color:#94a3b8; margin-bottom:2rem; text-align:center; position:relative; z-index:1; }

        /* ===== FORM ===== */
        form { display:flex; flex-direction:column; gap:1rem; position:relative; z-index:1; }
        .input-group { display:flex; flex-direction:column; gap:4px; }
        label {
            font-size:0.85rem; font-weight:500; color:#94a3b8;
            display:flex; align-items:center; gap:0.35rem; line-height:1.3;
        }
        .label-icon { display:inline-flex; align-items:center; opacity:0.7; }

        /* ===== NUMBER INPUT FIELDS ===== */
        input[type="number"] {
            padding:0.75rem 0.9rem; border-radius:0.6rem; border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.04); color:#e2e8f0; outline:none; font-size:0.95rem;
            font-family:'Inter',sans-serif; transition:transform 0.2s ease, box-shadow 0.25s ease, border-color 0.2s;
            width:100%; position:relative; z-index:1;
            -moz-appearance:textfield;   /* hide spinners in Firefox */
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }   /* hide spinners in Chrome/Safari */
        input::placeholder { color:#64748b; }
        input:focus {
            border-color:#60a5fa;
            box-shadow:0 0 0 3px rgba(96,165,250,0.18), 0 0 20px rgba(59,130,246,0.2);
            transform:scale(1.01); background:rgba(255,255,255,0.04); outline:none;
        }

        /* ===== CONTINUE BUTTON ===== */
        .btn {
            margin-top:4px; padding:0.85rem; border-radius:0.6rem; border:none;
            background:linear-gradient(135deg, #2563eb, #1d4ed8, #3b82f6); background-size:200% 200%;
            color:white; font-weight:600; font-size:1rem; cursor:pointer; font-family:'Inter',sans-serif;
            letter-spacing:0.15px; transition:transform 0.2s, box-shadow 0.3s, opacity 0.25s, background-position 0.4s;
            position:relative; overflow:hidden; box-shadow:0 4px 15px rgba(59,130,246,0.4);
            animation:btnGlow 2.5s infinite alternate; z-index:1;
            display:flex; align-items:center; justify-content:center; gap:0.5rem;
        }
        @keyframes btnGlow {
            0% { box-shadow:0 0 8px rgba(59,130,246,0.7); }
            100% { box-shadow:0 0 25px rgba(37,99,235,0.9), 0 0 10px rgba(96,165,250,0.8); }
        }
        .btn:hover {
            transform:translateY(-2px); background-position:100% 0%;
            box-shadow:0 10px 30px rgba(37,99,235,0.65), 0 0 20px rgba(59,130,246,0.6); animation:none;
        }
        .btn:active { transform:translateY(0); opacity:0.9; }

        /* ===== RESPONSIVE ===== */
        @media (max-width:480px) {
            .details-card { padding:1.8rem 1.5rem; border-radius:1.25rem; }
            .logo { font-size:1.3rem; margin-top:0.4rem; margin-bottom:0.3rem; }
            h1 { font-size:1.4rem; }
            .subhead { font-size:0.85rem; margin-bottom:1.5rem; }
            label { font-size:0.8rem; }
            .back-top { top:0.6rem; left:0.6rem; width:28px; height:28px; }
            .back-top svg { width:15px; height:15px; }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="details-card">
    <!-- ===== BACK BUTTON ===== -->
    <a href="javascript:history.back()" class="back-top" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
    </a>

    <!-- ===== BRAND LOGO ===== -->
    <div class="logo">🏡 TECH <span>SOCIETY</span></div>

    <!-- ===== HEADING ===== -->
    <h1>Society Layout</h1>
    <p class="subhead">Share details about your society</p>

    <form id="detailsForm" autocomplete="off" novalidate>

        <!-- ===== QUESTION 1: SOCIETY WINGS ===== -->
        <div class="input-group">
            <label for="mainWings">
                <span class="label-icon">
                    <!-- Grid icon -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                    </svg>
                </span>
                How many wings are there in your society?
            </label>
            <input type="number" id="mainWings" name="mainWings" placeholder="e.g., 8" min="1" required autofocus />
        </div>

        <!-- ===== QUESTION 2: FLOORS PER BUILDING ===== -->
        <div class="input-group">
            <label for="floors">
                <span class="label-icon">
                    <!-- Building/floor icon -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="3" y1="15" x2="21" y2="15" />
                        <line x1="9" y1="3" x2="9" y2="21" />
                    </svg>
                </span>
                How many floors are there in your building/tower?
            </label>
            <input type="number" id="floors" name="floors" placeholder="e.g., 12" min="1" required />
        </div>

        <!-- ===== QUESTION 3: FLATS PER FLOOR ===== -->
        <div class="input-group">
            <label for="flatsPerFloor">
                <span class="label-icon">
                    <!-- Same building icon -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="3" y1="15" x2="21" y2="15" />
                        <line x1="9" y1="3" x2="9" y2="21" />
                    </svg>
                </span>
                How many flats are there on every floor?
            </label>
            <input type="number" id="flatsPerFloor" name="flatsPerFloor" placeholder="e.g., 8" min="1" required />
        </div>

        <!-- ===== SUBMIT (Continue) ===== -->
        <button type="submit" class="btn">
            <!-- Arrow icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14" />
                <polyline points="12 5 19 12 12 19" />
            </svg>
            Continue
        </button>
    </form>
</div>

<!-- ===== VALIDATION & REDIRECT SCRIPT ===== -->
<script>
    document.getElementById('detailsForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const mainWings = document.getElementById('mainWings').value.trim();
        const floors = document.getElementById('floors').value.trim();
        const flatsPerFloor = document.getElementById('flatsPerFloor').value.trim();

        /* Validate each integer input (must be > 0) */
        if (mainWings === '' || mainWings < 1) {
            alert('Please enter a valid number of society wings (at least 1).');
            return;
        }
        if (floors === '' || floors < 1) {
            alert('Please enter a valid number of floors (at least 1).');
            return;
        }
        if (flatsPerFloor === '' || flatsPerFloor < 1) {
            alert('Please enter a valid number of flats per floor (at least 1).');
            return;
        }

        /* All valid – go to Secretary login page */
        window.location.href = 'Secratary%20login%20page.html';
    });
</script>

</body>
</html>
