<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>TECH SOCIETY · Sub Society Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== GLOBAL RESET ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { height:100%; }

        /* ===== BODY – centred with animated blue background ===== */
        body {
            font-family: 'Inter', sans-serif;
            background: 
                radial-gradient(circle at 25% 25%, rgba(59,130,246,0.25) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(37,99,235,0.25) 0%, transparent 55%),
                linear-gradient(145deg, #0a0f1a 0%, #112244 40%, #0d1b3e 100%);
            min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
            color:#e2e8f0; padding:1rem; line-height:1.5; position:relative; overflow-x:hidden;
        }

        /* ===== FLOATING BLOBS (pseudo‑elements) ===== */
        body::before, body::after {
            content:''; position:fixed; border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none;
            animation:floatBlob 20s infinite alternate ease-in-out;
        }
        body::before { width:320px; height:320px; background:radial-gradient(circle, rgba(59,130,246,0.45) 0%, transparent 70%); top:-120px; left:-120px; }
        body::after { width:300px; height:300px; background:radial-gradient(circle, rgba(37,99,235,0.45) 0%, transparent 70%); bottom:-100px; right:-100px; animation-duration:25s; animation-delay:-5s; }
        @keyframes floatBlob {
            0% { transform:translate(0,0) scale(1); }
            33% { transform:translate(30px,-40px) scale(1.15); }
            66% { transform:translate(-20px,20px) scale(0.9); }
            100% { transform:translate(10px,-10px) scale(1.05); }
        }

        /* ===== GLASS QUESTION CARD ===== */
        .question-card {
            width:100%; max-width:460px; background:rgba(15,23,42,0.85);
            backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            border-radius:1.5rem; padding:2.5rem 2rem; margin:auto; position:relative; z-index:1;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
            animation:cardEntry 0.6s cubic-bezier(0.22,1,0.36,1) both;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7), 0 0 30px rgba(59,130,246,0.15); overflow:hidden;
        }
        .question-card::before {
            content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
            background:linear-gradient(135deg, #3b82f6, #60a5fa, #1d4ed8);
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; transition:opacity 0.3s;
        }
        .question-card::after {
            content:''; position:absolute; top:-40%; left:-40%; width:180%; height:180%;
            background:radial-gradient(circle at 30% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
                       radial-gradient(circle at 70% 70%, rgba(37,99,235,0.06) 0%, transparent 50%);
            pointer-events:none;
        }
        @keyframes cardEntry {
            0% { opacity:0; transform:translateY(30px) scale(0.97); }
            100% { opacity:1; transform:translateY(0) scale(1); }
        }
        @media (hover:hover) {
            .question-card:hover { transform:translateY(-5px); box-shadow: 0 35px 70px -15px rgba(0,0,0,0.8), 0 0 40px rgba(59,130,246,0.25); }
            .question-card:hover::before { opacity:0.9; }
        }

        /* ===== BACK BUTTON (top‑left circle) ===== */
        .back-top {
            position: absolute; top: 0.75rem; left: 0.75rem; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8; text-decoration: none;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        .back-top:hover { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; transform: translateX(-2px); }
        .back-top svg { width:16px; height:16px; }

        /* ===== BRAND LOGO ===== */
        .logo {
            font-size:1.5rem; font-weight:700; margin-top:0.5rem; margin-bottom:0.5rem;
            letter-spacing:-0.3px; white-space:nowrap;
            display:inline-block; transition:transform 0.3s ease; z-index:1; position:relative;
        }
        .logo:hover { transform:scale(1.03); }
        .logo span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa, #2563eb);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; animation:gradientShift 3s ease infinite; background-size:200% 200%;
        }
        @keyframes gradientShift {
            0%,100% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
        }

        /* ===== HEADING (larger for this question) ===== */
        h1 {
            font-size:2rem; font-weight:700; margin-bottom:0.5rem; letter-spacing:-0.4px;
            background:linear-gradient(to right, #e0e7ff, #93c5fd);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; text-align:center; position:relative; z-index:1;
        }
        .subhead { font-size:0.95rem; color:#94a3b8; margin-bottom:2rem; text-align:center; position:relative; z-index:1; }

        /* ===== YES/NO BUTTONS ===== */
        .options { display:flex; flex-direction:column; gap:1rem; position:relative; z-index:1; }
        .option-btn {
            display:flex; align-items:center; justify-content:center; gap:0.8rem;
            padding:1rem 1.5rem; border-radius:0.8rem; border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.04); color:#e2e8f0; font-size:1rem; font-weight:600;
            cursor:pointer; transition:all 0.25s ease; text-decoration:none;
            position:relative; overflow:hidden;
        }
        .option-btn::before {
            content:''; position:absolute; inset:0;
            background:linear-gradient(135deg, rgba(59,130,246,0.15), rgba(37,99,235,0.1));
            opacity:0; transition:opacity 0.25s; border-radius:inherit;
        }
        .option-btn:hover {
            background:rgba(59,130,246,0.1); border-color:rgba(96,165,250,0.5);
            transform:translateY(-2px); box-shadow: 0 8px 25px -5px rgba(59,130,246,0.25);
        }
        .option-btn:hover::before { opacity:1; }
        .option-btn:active { transform:translateY(0); }
        .option-icon {
            display:flex; align-items:center; justify-content:center; width:44px; height:44px;
            border-radius:50%; background:rgba(59,130,246,0.15); flex-shrink:0;
            transition:background 0.25s; z-index:2;
        }
        .option-btn:hover .option-icon { background:rgba(59,130,246,0.3); }
        .option-text { z-index:2; }
        .option-label { font-size:0.95rem; }

        /* ===== RESPONSIVE ===== */
        @media (max-width:480px) {
            .question-card { padding:1.8rem 1.5rem; border-radius:1.25rem; }
            .logo { font-size:1.3rem; margin-top:0.4rem; margin-bottom:0.4rem; }
            h1 { font-size:1.7rem; }
            .subhead { font-size:0.85rem; margin-bottom:1.5rem; }
            .option-btn { padding:0.85rem 1rem; }
            .option-icon { width:38px; height:38px; }
            .back-top { top:0.6rem; left:0.6rem; width:28px; height:28px; }
            .back-top svg { width:15px; height:15px; }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="question-card">
    <!-- ===== BACK BUTTON ===== -->
    <a href="javascript:history.back()" class="back-top" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
    </a>

    <!-- ===== BRAND LOGO ===== -->
    <div class="logo">🏡 TECH <span>SOCIETY</span></div>

    <!-- ===== QUESTION ===== -->
    <h1>Does your society have a sub society?</h1>
    <p class="subhead">Select an option to continue</p>

    <div class="options">
        <!-- ===== YES → subsociety detail page ===== -->
        <a href="page%201%20(sub%20soc).html" class="option-btn">
            <div class="option-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />   <!-- checkmark -->
                </svg>
            </div>
            <div class="option-text">
                <span class="option-label">Yes</span>
            </div>
        </a>

        <!-- ===== NO → society-only layout page ===== -->
        <a href="page%202%20(no%20sub-soc).html" class="option-btn">
            <div class="option-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />   <!-- X -->
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </div>
            <div class="option-text">
                <span class="option-label">No</span>
            </div>
        </a>
    </div>
</div>

</body>
</html>
